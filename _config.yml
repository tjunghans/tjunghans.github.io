timezone: Europe/Zurich
author: "Thomas Junghans"
title: "Thomas Junghans"
description: "Software engineering team lead based in Zurich, Switzerland."
url: "https://thomasjunghans.ch"
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
exclude:
  - CLAUDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - tailwind.config.js
  - node_modules
  - vendor
  - .claude
  - .editorconfig
  - .nvmrc
  - .jekyll-cache
defaults:
  -
    scope:
      path: "assets/img"
    values:
      image: true
  -
    scope:
      path: ""
    values:
      layout: "default"
      image: "/assets/img/thomas-junghans_web_sw.jpg"
  -
   scope:
      path: ""
      type: "posts" 
   values:
      layout: "post"